name: Toolixa CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python and catalog quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core, optional local gateway, and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./core[gateway]"
          python -m pip install "pytest>=9.0.3,<10" "ruff>=0.8,<1"

      - name: Install the Web Scraper's isolated dependency
        run: python -m pip install -r agents/06-web-scraper/requirements.txt

      - name: Compile all Python sources
        run: python -m compileall -q core/src agents scripts tests

      - name: Lint
        run: ruff check core/src agents scripts tests

      - name: Check formatting
        run: ruff format --check core/src agents scripts tests

      - name: Validate generated agent catalog
        run: python scripts/build_catalog.py --check

      - name: Run tests
        run: python -m pytest -q
