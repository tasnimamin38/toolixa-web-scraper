name: Toolixa Dependency Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit declared third-party runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tooling on patched build tooling
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1,<85" "pip-audit>=2,<4"

      - name: Install local gateway and isolated scraper dependencies
        run: |
          python -m pip install -e "./core[gateway]" -r agents/06-web-scraper/requirements.txt

      - name: Audit installed third-party dependencies
        run: pip-audit

      - name: Confirm core has no mandatory third-party dependencies
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("core/pyproject.toml").read_text(encoding="utf-8"))
          dependencies = metadata["project"].get("dependencies", [])
          if dependencies:
              raise SystemExit(f"Unexpected core runtime dependencies: {dependencies}")
          print("toolixa-core has no mandatory third-party runtime dependencies")
          PY
