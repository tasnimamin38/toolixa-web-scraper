  <circle cx="1160" cy="190" r="250" fill="url(#glow)"/>
  <circle cx="1160" cy="190" r="112" fill="#49dfbc" opacity=".10" filter="url(#soft)"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".9">
    <path d="M1040 104L1135 66L1250 108L1310 210L1235 308L1118 322L1028 248Z" opacity=".46"/>
    <path d="M1135 66L1160 190L1310 210M1040 104L1160 190L1028 248M1250 108L1160 190L1235 308M1118 322L1160 190" opacity=".62"/>
    <path d="M1005 186L1160 190L1300 150M1080 340L1160 190L1260 352" opacity=".30" stroke-dasharray="5 8"/>
  </g>
  <g fill="#0c2535" stroke="url(#accent)" stroke-width="2">
    <circle cx="1040" cy="104" r="8"/><circle cx="1135" cy="66" r="7"/>
    <circle cx="1250" cy="108" r="9"/><circle cx="1310" cy="210" r="7"/>
    <circle cx="1235" cy="308" r="8"/><circle cx="1118" cy="322" r="7"/>
    <circle cx="1028" cy="248" r="8"/><circle cx="1160" cy="190" r="20" fill="#102f3a" stroke-width="3"/>
  </g>
