<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Toolixa Agents</title>
  <desc id="desc">A local-first Python AI agent ecosystem with a modular gateway, provider integrations and controlled execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071527"/>
      <stop offset=".56" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#101f2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ef2c2"/>
      <stop offset="1" stop-color="#61a9ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2bd7b0" stop-opacity=".24"/>
      <stop offset="1" stop-color="#2bd7b0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8bb6d0" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
