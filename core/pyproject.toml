[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolixa-core"
version = "0.1.0"
description = "Small, provider-neutral contracts and safety primitives for Toolixa agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gateway = [
    "cryptography>=50.0.0,<51",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"toolixa_core.gateway" = ["templates/*.html", "static/*.css"]
